name: OMsignal
description: 'OMsignal was a Montreal-based biometric smart-apparel startup, backed by Bessemer
  Venture Partners, that built compression shirts and the OMbra sports bra with embedded textile
  sensors streaming heart-rate, breathing, and activity data to a companion mobile app. The brand
  no longer operates independently: the omsignal.com domain now 301-redirects to hexoskin.com
  (Carre Technologies / Hexoskin), the biometric smart-clothing company that absorbed the product
  line. As of this enrichment pass OMsignal publishes no independent developer portal, API, or
  documentation of its own, and omsignal.com itself serves no API artifacts or well-known metadata.'
